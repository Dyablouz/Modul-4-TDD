<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div class="container my-2">
    <h3>Pay Order</h3>
    <p th:text="'Order ID: ' + ${orderId}">Order ID:</p>

    <form th:action="@{/order/pay/{orderId}(orderId=${orderId})}" method="post">
        <div class="form-group">
            <label for="methodInput">Payment Method</label>
            <input id="methodInput" name="method" type="text" class="form-control mb-4 col-4" placeholder="VOUCHER_CODE or BANK_TRANSFER">
        </div>

        <div class="form-group">
            <label for="voucherCodeInput">Voucher Code (for VOUCHER_CODE)</label>
            <input id="voucherCodeInput" name="voucherCode" type="text" class="form-control mb-4 col-4" placeholder="ESHOP1234ABC5678">
        </div>

        <div class="form-group">
            <label for="bankNameInput">Bank Name (for BANK_TRANSFER)</label>
            <input id="bankNameInput" name="bankName" type="text" class="form-control mb-4 col-4" placeholder="BCA">
        </div>

        <div class="form-group">
            <label for="referenceCodeInput">Reference Code (for BANK_TRANSFER)</label>
            <input id="referenceCodeInput" name="referenceCode" type="text" class="form-control mb-4 col-4" placeholder="REF123456789">
        </div>

        <button type="submit" class="btn btn-primary">Submit Payment</button>
    </form>
</div>
</body>
</html>
